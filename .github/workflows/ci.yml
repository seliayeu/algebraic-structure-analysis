name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-22.04

    env:
      LLVM_COMMIT: 104e82b75defd23ade610a5a75cd95244638ec0b

    steps:
    - name: Checkout asp project
      uses: actions/checkout@v4

    - name: Checkout LLVM
      uses: actions/checkout@v4
      with:
        repository: llvm/llvm-project
        ref: ${{ env.LLVM_COMMIT }}
        path: llvm-project

    - name: Cache LLVM build
      uses: actions/cache@v4
      with:
        path: llvm-build
        key: llvm-${{ runner.os }}-${{ env.LLVM_COMMIT }}

    - name: Configure LLVM
      run: |
        cmake -S llvm-project/llvm -B llvm-build \
          -G Ninja \
          -DLLVM_ENABLE_PROJECTS="mlir" \
          -DLLVM_TARGETS_TO_BUILD="host" \
          -DCMAKE_BUILD_TYPE=Release

    - name: Build LLVM
      run: ninja -C llvm-build

    - name: Configure ASP
      run: |
        cmake -S . -B build \
          -G Ninja \
          -DLLVM_BUILD=${{ github.workspace }}/llvm-build

    - name: Build ASP
      run: ninja -C build

    - name: Run Tests
      run: ninja -C build check-spa
